# This is the name of the workflow that will be displayed on GitHub
name: Rust CI

# This section defines when the workflow will run.
# It will trigger on any `push` to any branch, and on any `pull_request`.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs on pull requests only. On `push` to main the group is
# keyed on the commit SHA, so every main run is unique and is never cancelled
# or queued behind another one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This defines the environment for the workflow. We set Cargo to use color output.
env:
  CARGO_TERM_COLOR: always

# This section defines the jobs to be run. We have one job called "build".
jobs:
  build:
    # The name that will be displayed for this job on GitHub
    name: Test on ${{ matrix.os }}
    
    # This job will run on multiple operating systems to ensure cross-platform compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-latest, blacksmith-4vcpu-windows-2025]

    # These are the individual steps the job will execute in order
    steps:
    # 1. Check out the repository code so the workflow can access it
    - uses: actions/checkout@v4

    # 2. Cache ~/.cargo and target/ with Swatinem/rust-cache. The key includes
    #    the rustc version and Cargo.lock hash, restore-keys fall back to the
    #    newest compatible cache, and target/ is pruned of workspace artifacts
    #    before saving. Saves on every branch (an exact hit does not re-save);
    #    PR caches are scoped to the PR, while main's cache is visible to PRs.
    - name: Cache cargo dependencies
      uses: Swatinem/rust-cache@v2

    # 3. Check that the code is formatted correctly
    - name: Check formatting
      run: cargo fmt -- --check

    # 4. Run Clippy to check for common mistakes and enforce idiomatic Rust
    #    The `-D warnings` flag treats all warnings as errors, failing the build.
    - name: Run Clippy
      run: cargo clippy -- -D warnings

    # 5. Run the tests (if any are defined)
    - name: Run tests
      run: cargo test --verbose

    # 6. Build in release mode (LTO, codegen-units = 1, panic = "abort") on
    #    Linux only. release-binaries.yml builds every shipped target, but only
    #    after a release is published, so this is the one pre-merge check of
    #    the release profile. It is skipped on macOS and Windows because the
    #    LTO link is the slowest step and Windows sets the wall-clock.
    - name: Build
      if: runner.os == 'Linux'
      run: cargo build --release --verbose