# Dogfood the released difftree GitHub Action: post a diff-tree comment
# (rendered by `difftree --pr`) on pull requests in this repo.
#
# Fork PRs: GITHUB_TOKEN is read-only there, so the action logs a warning and
# skips the comment (the run still succeeds; the tree stays available in the
# job log and the `tree` output). Same-repo PRs get the sticky comment.
name: difftree PR comment

on:
  pull_request:

concurrency:
  group: difftree-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diff-tree:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required: the action runs `difftree --pr`, which
      # needs the base branch history to compute the merge-base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: smorinlabs/difftree-action@v0.1.0
